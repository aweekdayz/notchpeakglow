name: PeakGlow
options:
  bundleIdPrefix: com.aweekdayz
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ARCHS: arm64
    DEVELOPMENT_LANGUAGE: en
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  PeakGlow:
    type: application
    platform: macOS
    sources:
      - path: PeakGlow
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: PeakGlow/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.aweekdayz.peakglow
        PRODUCT_NAME: PeakGlow
        MARKETING_VERSION: "1.9.0"
        CURRENT_PROJECT_VERSION: "53"
        METAL_ENABLED: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
      configs:
        Debug:
          # Local Xcode runs are not signed with a team, so the hardened runtime's library
          # validation would refuse the embedded Sparkle framework. Release keeps it on and
          # signs everything with one Developer ID.
          ENABLE_HARDENED_RUNTIME: "NO"
    dependencies:
      - package: Sparkle
    scheme: {}
