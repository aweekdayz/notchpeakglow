name: PeakGlow
options:
  bundleIdPrefix: com.aweekdayz
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ARCHS: arm64
    DEVELOPMENT_LANGUAGE: en
targets:
  PeakGlow:
    type: application
    platform: macOS
    sources:
      - path: PeakGlow
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: PeakGlow/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.aweekdayz.peakglow
        PRODUCT_NAME: PeakGlow
        MARKETING_VERSION: "1.6.3"
        CURRENT_PROJECT_VERSION: "40"
        METAL_ENABLED: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
    scheme: {}

